<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resilience.ai — Workforce Resilience Prototype</title>
    <meta name="description" content="AI-enabled B2B HRTech prototype for employee burnout prevention and workforce resilience." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Mesh Gradient Background */
        background-color: #eef2ff;
        background-image: 
            radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), 
            radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, transparent 50%), 
            radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, transparent 50%);
        background-image: 
            radial-gradient(at 40% 20%, hsla(260, 100%, 90%, 1) 0px, transparent 50%),
            radial-gradient(at 80% 0%, hsla(189, 100%, 86%, 1) 0px, transparent 50%),
            radial-gradient(at 0% 50%, hsla(340, 100%, 90%, 1) 0px, transparent 50%),
            radial-gradient(at 80% 50%, hsla(240, 100%, 90%, 1) 0px, transparent 50%),
            radial-gradient(at 0% 100%, hsla(22, 100%, 90%, 1) 0px, transparent 50%),
            radial-gradient(at 80% 100%, hsla(242, 100%, 90%, 1) 0px, transparent 50%),
            radial-gradient(at 0% 0%, hsla(343, 100%, 90%, 1) 0px, transparent 50%);
        background-attachment: fixed;
        background-size: cover;
        color: #1e293b;
        overflow-x: hidden;
      }
      
      /* Hide scrollbar for cleaner look in some containers */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes enter {
        from { opacity: 0; transform: translateY(10px) scale(0.99); filter: blur(4px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }
      .animate-enter {
        animation: enter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
    </style>

</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
